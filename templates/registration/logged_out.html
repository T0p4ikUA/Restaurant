{% extends "base.html" %}

{% block content %}

  <div class="col-md-6 col-lg-5 text-center">
    <div class="card shadow-sm border-0">
      <div class="card-body p-5">
        <h2 class="fw-bold mb-3">Logged Out</h2>

      </div>
    </div>
  </div>
</div>
{% endblock %}
