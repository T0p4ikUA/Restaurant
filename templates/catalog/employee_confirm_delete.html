{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4 text-center">
        <h2 class="fw-bold text-danger mb-3">Delete Employee</h2>
        <p class="text-muted mb-4">Are you sure you want to delete this employee: <strong class="text-dark">{{ employee }}</strong>?</p>
        <form action="" method="post" class="d-flex gap-2 justify-content-center">
          {% csrf_token %}
          <a href="{% url 'catalog:employee-list' %}" class="btn btn-outline-secondary w-50">Cancel</a>
          <input type="submit" value="Yes, delete" class="btn btn-danger w-50">
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
