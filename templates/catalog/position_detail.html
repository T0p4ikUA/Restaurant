{% extends "base.html" %}

{% block content %}

  <div class="d-flex justify-content-between align-items-center">
    <h2 class="fw-bold mb-0">Position: <span class="text-muted">{{ position.name }}</span></h2>
    <a class="btn btn-outline-secondary" href="{% url 'catalog:position-update' pk=position.id %}">Edit Position</a>
  </div>
</div>
{% endblock %}
