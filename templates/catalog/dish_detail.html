{% extends "base.html" %}

{% block content %}
<div class="card shadow-sm border-0 p-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">Dish Name: <span class="text-muted">{{ dish.dish_name }}</span></h2>
    <a class="btn btn-outline-secondary" href="{% url 'catalog:dish-update' pk=dish.id %}">Edit Dish</a>
  </div>

  <ul class="list-group list-group-flush">
    <li class="list-group-item px-0"><strong>Price:</strong> ${{ dish.price }}</li>
    <li class="list-group-item px-0"><strong>Cooked by:</strong> {{ dish.cooked_by.username|default:"—" }}</li>
    <li class="list-group-item px-0"><strong>Description:</strong> {{ dish.description|default:"No description available." }}</li>
  </ul>
</div>
{% endblock %}
