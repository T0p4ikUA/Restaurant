{% extends "base.html" %}

{% block content %}
  <h1>Dish Name: {{ dish.dish_name }} <a class="btn btn-secondary" style="float: right" href="{% url 'catalog:dish-update' pk=dish.id %}">Edit</a></h1>

  <div class="ml-3">
    <p><strong>Price:</strong> ${{ dish.price }}</p>
    <p><strong>Cooked by:</strong> {{ dish.cooked_by.username|default:"—" }}</p>
    <p><strong>Description:</strong> {{ dish.description|default:"No description available." }}</p>
  </div>
{% endblock %}
