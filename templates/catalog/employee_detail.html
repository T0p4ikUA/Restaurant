{% extends "base.html" %}

{% block content %}
<div class="card shadow-sm border-0 p-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">Employee: <span class="text-muted">{{ employee.username }}</span></h2>
    <a class="btn btn-outline-secondary" href="{% url 'catalog:employee-update' pk=employee.id %}">Edit Employee</a>
  </div>

  <ul class="list-group list-group-flush">
    <li class="list-group-item px-0">
      <strong>Position:</strong>
      {% if employee.position %}
        <a href="{% url 'catalog:position-detail' pk=employee.position.id %}" class="text-decoration-none">{{ employee.position.name }}</a>
      {% else %}
        —
      {% endif %}
    </li>
    <li class="list-group-item px-0">
      <strong>Is Active:</strong>
      {% if employee.is_active %}
        <span class="badge bg-success">Active</span>
      {% else %}
        <span class="badge bg-secondary">Inactive</span>
      {% endif %}
    </li>
  </ul>
</div>
{% endblock %}
